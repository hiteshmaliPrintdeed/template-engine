# Pixovo Story Mode -- demo deployment.
# Install as /etc/nginx/conf.d/pixovo.conf, then run certbot --nginx, which
# rewrites these blocks in place to add the TLS listeners and the 80->443
# redirect. Keep this file HTTP-only until certbot has run once: the HTTP-01
# challenge needs port 80 answering on both names.
#
# Ports: 8001 = uvicorn backend, 8413 = vite preview (built SPA). Both are bound
# to 127.0.0.1 by their unit files, so this proxy is the only way in. Only 80
# and 443 belong in the EC2 security group.

# --- UI: storymode.pixovo.com ------------------------------------------------
#
# The SPA calls the API with RELATIVE paths ('/api/...') -- there is no API base
# URL anywhere in frontend/src. That is why /api, /uploads and /exports are
# mapped to the backend from THIS server block rather than pointed at the API
# subdomain: it makes every request the browser issues same-origin, so no CORS
# preflight is ever generated. This block is the production stand-in for the
# Vite dev proxy in frontend/vite.config.js.
server {
    listen 80;
    server_name storymode.pixovo.com;

    # Ingest posts photos in batches (MAX_FILE_SIZE is 20 MiB per file).
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8413;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|uploads|exports) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingest, generation and PDF export all run long. The default 60s read
        # timeout surfaces as a 504 mid-upload.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Stream request bodies straight through instead of spooling whole
        # uploads to disk before the backend sees a byte.
        proxy_request_buffering off;

        # /uploads/{key} answers 307 to a presigned S3 URL in S3 mode. Let that
        # redirect reach the browser -- nginx must not follow it itself.
        proxy_redirect off;
    }
}

# --- API: apistorymode.pixovo.com -------------------------------------------
#
# Direct access to the backend for Swagger (/docs), curl and debugging. The SPA
# does NOT use this hostname; browser traffic goes through the block above.
server {
    listen 80;
    server_name apistorymode.pixovo.com;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}
